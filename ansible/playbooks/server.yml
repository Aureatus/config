---
- name: Configure server or VPS from config repo
  hosts: all
  gather_facts: true
  vars:
    config_repo_root: "{{ playbook_dir }}/../.."
    config_user_home: "{{ ansible_env.HOME }}"
    config_package_list:
      - build-essential
      - ca-certificates
      - curl
      - eza
      - fd-find
      - fzf
      - gh
      - git
      - jq
      - ncurses-term
      - python3
      - python3-apt
      - ripgrep
      - unzip
      - xz-utils
      - zsh
    config_install_packages: true
    config_install_flatpak_apps: false
    config_install_devbox: false
    config_install_terminal_configs: false
    config_install_fonts: false
    config_set_default_shell: false
  roles:
    - common
    - user-config
    - runtime
