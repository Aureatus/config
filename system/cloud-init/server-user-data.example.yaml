#cloud-config
package_update: true
packages:
  - python3
  - python3-apt
  - git
  - curl
  - zsh

users:
  - default
  - name: __REMOTE_USERNAME__
    gecos: __REMOTE_FULL_NAME__
    shell: /usr/bin/zsh
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups:
      - sudo
    ssh_authorized_keys:
      - __SSH_PUBLIC_KEY__

runcmd:
  - install -d -m 0755 -o __REMOTE_USERNAME__ -g __REMOTE_USERNAME__ /home/__REMOTE_USERNAME__/dev
  - install -d -m 0755 -o __REMOTE_USERNAME__ -g __REMOTE_USERNAME__ /home/__REMOTE_USERNAME__/.config
